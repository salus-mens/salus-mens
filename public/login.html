<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso / Registro</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <img src="images.Logo.png" alt="Logo Salus Mens" class="auth-logo">
                <h2>Iniciar Sesión</h2>
                <p>Bienvenido a tu espacio seguro</p>
            </div>
            <form action="api/login" method="POST">
                <div class="input-group">
                    <label for="login-email">Correo electrónico</label>
                    <input type="email" id="login-email" name="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" name="password" placeholder="********" required>
                </div>
                <button type="submit" class="btn-auth">Iniciar Sesión</button>
            </form>
        </div>

        <div class="auth-box auth-divider">
            <div class="auth-header">
                <h2>Crear Cuenta</h2>
                <p>Regístrate para recibir atención personalizada</p>
            </div>

            <form action="/api/registro" method="POST">
                <div class="input-group">
                    <label for="reg-nombre">Nombre Completo</label>
                    <input type="text" id="reg-nombre" name="nombre" placeholder="Juan Pérez" required>
                </div>
                <div class="input-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" name="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Contraseña Segura</label>
                    <input type="password" id="reg-password" name="password" placeholder="Mínimo 8 caracteres" required>
                </div>
                <button type="submit" class="btn-auth btn-secondary">Registrarse</button>
            </form>
        </div>
    </div>
</body>

</html>
